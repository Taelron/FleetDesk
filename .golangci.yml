# FleetDesk lint configuration — TAE-80.
#
# The canonical @Go Conventions config (SwitchX's), byte-identical where not
# stated otherwise. Every deviation and addition below carries a comment
# naming its reason, per this issue's AC 3.
version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign
    - revive
    - gosec
    - bodyclose
    - misspell
    # Addition: mechanises AC 7 — every //nolint directive must name a
    # specific linter and a reason, so a suppression's discipline is checked
    # by the tool rather than by convention alone.
    - nolintlint
  settings:
    # errcheck's default exclusions are kept deliberately: no
    # disable-default-exclusions. See @Go Conventions' Linting section.
    errcheck: {}
    gosec:
      excludes:
        # Addition: gosec's G104 duplicates errcheck's "unchecked error"
        # check. Without this, golangci-lint's issues.uniq-by-line hides the
        # duplicate G104 behind errcheck's finding on the same line — until a
        # //nolint:errcheck suppression removes errcheck's finding and G104
        # surfaces underneath, unsuppressed. Excluding G104 here keeps a
        # single //nolint:errcheck // TAE-82 sufficient at each site instead
        # of forcing every site to also name gosec.
        - G104
    revive:
      rules:
        - name: var-naming
        - name: package-comments
        - name: exported
          # Deviation: disables revive's type-name stutter check
          # (e.g. k8s.K8sPod, azure.AzureSubscription). Clearing it would
          # rename ~200 call sites across every open M3 issue's files for no
          # behaviour change — declined in TAE-80.
          arguments:
            - disableStutteringCheck
    nolintlint:
      allow-unused: false
      require-explanation: true
      require-specific: true
  exclusions:
    rules:
      # False-positive-heavy in test code specifically, named by rule ID
      # rather than the whole gosec linter so a real finding in test code
      # (a subprocess launch, say) still surfaces: G304 (file inclusion) and
      # G703 (path traversal) on paths built from t.TempDir() plus a literal
      # name; G301/G306 (permissive dir/file modes) on throwaway test
      # fixtures nothing else reads; G115 (int->rune overflow) on a small,
      # bounded loop index used to generate readable test data. None of
      # these touch production code — the equivalent findings there are
      # fixed or suppressed per-site with a narrow, issue-citing reason
      # (AC 7), which this class-level exclusion deliberately does not cover.
      - path: "_test\\.go"
        linters:
          - gosec
        text: "G304:|G703:|G301:|G306:|G115:"
  # Deviation: depguard is omitted. The canonical rules encode the
  # four-layer hexagonal split (domain/app/storage/ui); Design Notes D-1
  # records that FleetDesk does not have that split — its layering is
  # app + backend packages instead. A FleetDesk-shaped guard enforcing D-1's
  # own invariants (backends carry zero Bubble Tea/Lipgloss imports; backends
  # never import internal/app) is TAE-83.

issues:
  # Deviation: both caps disabled. golangci-lint's defaults
  # (max-issues-per-linter: 50, max-same-issues: 3) truncate output
  # silently — they turned this issue's own 170 findings into a reported
  # 122, then 103, before the config was ever run. Without this, a reported
  # count is not the whole count and `make lint`'s zero-findings claim is not
  # verifiable against it.
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - gofmt
    - goimports
