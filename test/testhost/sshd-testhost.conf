# Explicit rather than relying on the base image's commented-out defaults
# (AC 3): both auth methods must work, independently, for testuser1, and
# password auth alone for testuser2.
PasswordAuthentication yes
PubkeyAuthentication yes
PermitRootLogin no

# TAE-116: the acceptance tests open many connections that never authenticate
# (ssh-keyscan, one per key type, to read the host key). OpenSSH's per-source
# penalties treat that as abuse and, after a few, drop the next connection
# from the same address -- including a real login, which FleetDesk would read
# as an authentication failure. A throwaway test host does not throttle its
# own tests.
PerSourcePenalties no
